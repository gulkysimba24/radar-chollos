name: Radar de chollos

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Revisar Wallapop y avisar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MAPA_URL: ${{ vars.MAPA_URL }}
        run: python3 main.py

      - name: Guardar estado y mapa
        if: always()
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet && exit 0
          git commit -m "Radar: revisión $(date -u +%H:%M)"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs --autostash && git push && exit 0
            git rebase --abort 2>/dev/null; sleep 5
          done
          exit 1
