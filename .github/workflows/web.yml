name: Avisos de la web

# Se ejecuta en cuanto guardáis algo o apuntáis una compra/venta desde la web:
# avisa en Telegram y analiza los enlaces de Wallapop que hayáis guardado.
on:
  push:
    branches: [main]
    paths:
      - guardados.json
      - registro.json
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Avisar en Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAPA_URL: ${{ vars.MAPA_URL }}
        run: python3 main.py --web

      - name: Guardar estado
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add *.json
          git diff --cached --quiet && exit 0
          git commit -m "Web: avisos $(date -u +%H:%M)"
          git pull --rebase --autostash || true
          git push
